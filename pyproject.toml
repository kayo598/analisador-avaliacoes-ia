[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "analisador-avaliacoes-ia"
version = "0.4.0"
description = "Classifica avaliações de delivery com um LLM: sentimento, problemas e urgência."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff", "mypy"]

[project.scripts]
avaliacoes-ia = "avaliacoes_ia.__main__:main"

[tool.setuptools]
packages = ["avaliacoes_ia"]

[tool.setuptools.package-data]
avaliacoes_ia = ["gabarito.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF", "PL", "C4", "PIE", "RET"]
ignore = ["PLR2004", "RUF001", "RUF002", "RUF003", "PLR0913"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
